spring:
  application:
    name: nevis-search-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nevis}
    username: ${DB_USERNAME:nevis}
    password: ${DB_PASSWORD:nevis}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  web:
    locale: en
    locale-resolver: fixed

server:
  port: ${SERVER_PORT:8080}

nevis:
  search:
    max-query-length: ${MAX_QUERY_LENGTH:255}
    max-results: ${MAX_SEARCH_RESULTS:50}
    client:
      trigram-threshold: ${CLIENT_TRIGRAM_SIMILARITY_THRESHOLD:0.50}
    semantic:
      candidate-limit: ${SEMANTIC_CANDIDATE_LIMIT:10}
      rrf-k: ${SEMANTIC_RRF_K:60}
      minimum-similarity: ${SEMANTIC_MINIMUM_SIMILARITY:0.30}
      lexical-weight: ${SEMANTIC_LEXICAL_WEIGHT:1.25}
      vector-weight: ${SEMANTIC_VECTOR_WEIGHT:1.0}
  documents:
    max-content-length: ${MAX_DOCUMENT_CONTENT_LENGTH:1000000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
