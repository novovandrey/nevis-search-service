spring:
  application:
    name: nevis-search-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nevis}
    username: ${DB_USERNAME:nevis}
    password: ${DB_PASSWORD:nevis}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  web:
    locale: en
    locale-resolver: fixed

server:
  port: ${SERVER_PORT:8080}

nevis:
  search:
    max-query-length: ${MAX_QUERY_LENGTH:255}
    max-results: ${MAX_SEARCH_RESULTS:50}
    semantic:
      candidate-limit: ${SEMANTIC_CANDIDATE_LIMIT:50}
      rrf-k: ${SEMANTIC_RRF_K:60}
      minimum-similarity: ${SEMANTIC_MINIMUM_SIMILARITY:0.15}
  documents:
    max-content-length: ${MAX_DOCUMENT_CONTENT_LENGTH:1000000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
