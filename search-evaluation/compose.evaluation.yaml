services:
  postgres:
    ports:
      - "127.0.0.1:${EVALUATION_DB_HOST_PORT:-15432}:5432"

  app:
    environment:
      SPRING_PROFILES_ACTIVE: evaluation
      EVALUATION_EMBEDDING_MODEL: ${EVALUATION_EMBEDDING_MODEL:-MINILM}
      DOCUMENT_CHUNK_MAX_INPUT_TOKENS: ${DOCUMENT_CHUNK_MAX_INPUT_TOKENS:-240}
      DOCUMENT_CHUNK_MAX_TITLE_TOKENS: ${DOCUMENT_CHUNK_MAX_TITLE_TOKENS:-32}
      DOCUMENT_CHUNK_OVERLAP_TOKENS: ${DOCUMENT_CHUNK_OVERLAP_TOKENS:-30}
      SEMANTIC_CANDIDATE_LIMIT: ${SEMANTIC_CANDIDATE_LIMIT:-50}
      SEMANTIC_CHUNK_CANDIDATE_LIMIT: ${SEMANTIC_CHUNK_CANDIDATE_LIMIT:-250}
      SEMANTIC_HNSW_EF_SEARCH: ${SEMANTIC_HNSW_EF_SEARCH:-500}
      SEMANTIC_MINIMUM_SIMILARITY: ${SEMANTIC_MINIMUM_SIMILARITY:-0.30}
