[project]
name = "nevis-search-evaluation"
version = "0.1.0"
description = "Reproducible offline evaluation for the Nevis Java search service"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
